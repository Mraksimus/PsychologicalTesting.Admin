name: CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL || 'https://psychological-testing.mraksimus.ru/api' }}

jobs:
  publish-admin:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: 🔧 Set image name
        id: image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="$REPO_LOWER/admin"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: 🔧 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run linter
        run: pnpm lint

      - name: ✅ Run type check
        run: pnpm typecheck

      - name: 🏗️ Build application
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Restart application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/psychological-testing
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull admin
            docker compose up -d admin
